services:
  mysql:
    image: mysql:8.0
    container_name: data-server-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Hcd123.@
      MYSQL_DATABASE: data_server
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/data-server-runtime/src/main/resources/db/migration/V1__init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pHcd123.@"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: data-server-redis
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  admin:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP_MODULE: data-server-admin-app
        APP_JAR: data-server-admin.jar
    container_name: data-server-admin
    environment:
      ADMIN_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/data_server?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Hcd123.@
      SPRING_FLYWAY_ENABLED: false
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: change-me-dev-jwt-secret-key-32ch
      ENCRYPT_KEY: change-me-dev-encrypt-key-32ch!
      LOG_PATH: /app/logs/data-server-admin
      TZ: Asia/Shanghai
    ports:
      - "${ADMIN_PUBLISHED_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - admin-logs:/app/logs
    restart: unless-stopped

  gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        APP_MODULE: data-server-gateway-app
        APP_JAR: data-server-gateway.jar
    container_name: data-server-gateway
    environment:
      GATEWAY_SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/data_server?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Hcd123.@
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: change-me-dev-jwt-secret-key-32ch
      ENCRYPT_KEY: change-me-dev-encrypt-key-32ch!
      LOG_PATH: /app/logs/data-server-gateway
      TZ: Asia/Shanghai
    ports:
      - "${GATEWAY_PUBLISHED_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin:
        condition: service_started
    volumes:
      - gateway-logs:/app/logs
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: data-server-web
    ports:
      - "${WEB_PUBLISHED_PORT:-3000}:80"
    depends_on:
      - admin
      - gateway
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  admin-logs:
  gateway-logs:
