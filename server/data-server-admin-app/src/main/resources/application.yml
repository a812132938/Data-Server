server:
  port: ${ADMIN_SERVER_PORT:8080}

spring:
  application:
    name: data-server-admin
  datasource:
    url: jdbc:mysql://localhost:3306/data_server?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Hcd123.@
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-concurrent: true
  jwt-secret-key: ${JWT_SECRET_KEY:default-dev-jwt-secret-key-32ch}

encrypt:
  key: ${ENCRYPT_KEY:default-dev-encrypt-key-32ch!}

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  file:
    path: ${LOG_PATH:logs/data-server-admin}
  level:
    root: INFO
    com.isom.dataserver: INFO
    com.isom.dataserver.module.gateway: WARN
    org.springframework: WARN
    org.springframework.boot.web.embedded.tomcat: INFO
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN
    java.sql: WARN
    com.zaxxer.hikari: WARN
    cn.dev33.satoken: WARN
    springfox: ERROR
